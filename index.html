<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Cerco Casa · Bogdan & Camilla</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root{--bg:#f7f5f1;--card:#fff;--text:#222;--muted:#6f6a63;--accent:#1f6f5f;--line:#ded8d0;--chip:#ece7df;--warn:#a5641c;--new:#7b3ff2;--good:#147a54;--eval:#a5641c;--ignore:#77716a}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{padding:16px 16px 10px;position:sticky;top:0;background:rgba(247,245,241,.96);backdrop-filter:blur(10px);z-index:1000;border-bottom:1px solid var(--line)}
    h1{font-size:22px;margin:0 0 3px}.sub{color:var(--muted);font-size:14px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.addbtn{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;padding:10px 12px;min-height:42px;white-space:nowrap;font-size:14px}
    .filters{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}.filters button,.filters select{min-height:42px;border:1px solid var(--line);border-radius:999px;background:white;padding:0 13px;font-size:15px;white-space:nowrap;color:var(--text)}.filters .active{background:var(--accent);color:#fff;border-color:var(--accent)}
    #map{height:48vh;min-height:340px;border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:0 auto}.summary{padding:12px 16px 0;color:var(--muted);font-size:14px}.sections{display:grid;gap:20px;padding:12px 16px 30px}.section-block{display:grid;gap:10px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 2px}.section-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}.section-count{font-size:12px;font-weight:800;min-width:26px;height:26px;border-radius:999px;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}.section-grid{display:grid;grid-template-columns:1fr;gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;position:relative}.card.is-new{border-color:#c9b7f8;box-shadow:0 4px 18px rgba(123,63,242,.08)}.card.is-ignored{opacity:.78}.card h2{font-size:18px;margin:0 0 4px}.price{font-weight:700;font-size:18px}.meta{color:var(--muted);font-size:14px;margin:4px 0 10px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font-size:12px;background:var(--chip);padding:5px 8px;border-radius:999px}.rating{font-weight:700;color:var(--accent)}.new-badge{font-size:11px;letter-spacing:.05em;font-weight:900;color:#fff;background:var(--new);padding:5px 8px;border-radius:999px;white-space:nowrap}.note{font-size:14px;line-height:1.4}.warning{color:var(--warn);font-weight:600}
    .decision{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}.decision button{border:1px solid var(--line);background:#fff;border-radius:11px;min-height:40px;padding:7px 6px;font:inherit;font-size:12px;font-weight:750;color:var(--text)}.decision button.active[data-pref-value="da-vedere"]{background:#e9f6f0;border-color:#9bcdb8;color:var(--good)}.decision button.active[data-pref-value="da-valutare"]{background:#fff4e8;border-color:#e7c08c;color:var(--eval)}.decision button.active[data-pref-value="ignorare"]{background:#efede9;border-color:#c9c3bc;color:#5f5b56}
    .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions a,.actions button{flex:1;min-width:92px;text-align:center;text-decoration:none;padding:11px;border-radius:12px;font:inherit;font-weight:600;min-height:44px}.primary{background:var(--accent);color:#fff;border:1px solid var(--accent)}.secondary{border:1px solid var(--line);color:var(--text);background:#fff}
    .user-notes{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.user-notes-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px}.note-list{display:grid;gap:7px}.note-item{background:#f5f2ed;border-radius:12px;padding:9px 10px}.note-head{font-size:11px;color:var(--muted);margin-bottom:3px}.note-text{font-size:13px;line-height:1.35;white-space:pre-wrap}.no-notes{font-size:12px;color:var(--muted)}
    .hidden{display:none!important}.leaflet-popup-content{margin:12px 14px;min-width:220px}.leaflet-popup-content h3{margin:0 0 4px}.leaflet-control-attribution{font-size:9px}
    dialog{border:0;border-radius:20px;padding:0;width:min(92vw,520px);box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.42)}.modal{padding:18px}.modal h2{margin:0 0 4px;font-size:21px}.modal p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.4}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;color:var(--text)}.field textarea{min-height:100px;resize:vertical}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions button{min-height:44px;border-radius:12px;padding:0 14px;font:inherit;font-weight:700}.send{background:var(--accent);color:#fff;border:0;flex:1}.cancel{background:#fff;border:1px solid var(--line)}.small{font-size:12px;color:var(--muted)}
    @media(min-width:760px){#map{height:56vh}.section-grid{grid-template-columns:repeat(2,1fr)}header{padding-left:24px;padding-right:24px}.summary{padding-left:24px}.sections{padding-left:24px;padding-right:24px}.addbtn{font-size:15px}}
  </style>
</head>
<body>
  <header><div class="wrap">
    <div class="topline"><div><h1>🏡 Cerco Casa</h1><div class="sub">Bogdan & Camilla · target ~€300k · fino a €360k se trattabile o pronta</div></div><button class="addbtn" id="openSuggest" type="button">＋ Segnala casa</button></div>
    <div class="filters">
      <button data-filter="all" class="active">Tutte</button><button data-filter="city">Bergamo città</button><button data-filter="garage">Garage</button><button data-filter="garden">Giardino</button><button data-filter="3bed">3+ camere</button>
      <select id="statusFilter" aria-label="Gradimento"><option value="all">Tutti i gradimenti</option><option value="new">🆕 Nuovi</option><option value="da-vedere">👀 Da vedere</option><option value="da-valutare">🤔 Da valutare</option><option value="ignorare">🚫 Ignorare</option></select>
    </div>
  </div></header>

  <div id="map"></div>
  <div class="wrap"><div class="summary" id="summary"></div><div class="sections" id="sections"></div></div>

  <dialog id="suggestDialog">
    <form class="modal" name="segnala-casa" method="POST" data-netlify="true" action="/grazie.html">
      <input type="hidden" name="form-name" value="segnala-casa" />
      <h2>Segnala una casa</h2><p>Incolla il link dell'annuncio. La segnalazione verrà analizzata e aggiunta alla mappa.</p>
      <div class="field"><label for="listingUrl">Link annuncio *</label><input id="listingUrl" name="url" type="url" required placeholder="https://www.immobiliare.it/annunci/…" autocomplete="url" /></div>
      <div class="field"><label for="sender">Segnalata da *</label><select id="sender" name="segnalata-da" required><option value="Camilla">Camilla</option><option value="Bogdan">Bogdan</option></select></div>
      <div class="field"><label for="priority">Priorità</label><select id="priority" name="priorita"><option value="Normale">Normale</option><option value="Da guardare subito">Da guardare subito</option></select></div>
      <div class="field"><label for="suggestNote">Nota</label><textarea id="suggestNote" name="nota" placeholder="Es. mi piace il giardino, controlla la zona…"></textarea></div>
      <div class="modal-actions"><button class="cancel" id="closeSuggest" type="button">Annulla</button><button class="send" type="submit">Invia segnalazione</button></div>
    </form>
  </dialog>

  <dialog id="noteDialog">
    <form class="modal" id="noteForm">
      <input type="hidden" id="noteHomeId" />
      <h2>📝 Aggiungi nota</h2><p id="noteHomeName"></p>
      <div class="field"><label for="noteAuthor">Scritta da</label><select id="noteAuthor" required><option value="Bogdan">Bogdan</option><option value="Camilla">Camilla</option></select></div>
      <div class="field"><label for="noteText">Nota *</label><textarea id="noteText" required maxlength="1000" placeholder="Es. zona molto bella, cucina da rifare, chiamare l'agenzia…"></textarea></div>
      <div class="small">Le note sono condivise: le vedrete entrambi anche da dispositivi diversi.</div>
      <div class="modal-actions"><button class="cancel" id="closeNote" type="button">Annulla</button><button class="send" id="saveNote" type="submit">Salva nota</button></div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/homes.js"></script>
  <script>
    const homes=window.HOMES||[];
    const baselineIds=new Set(['gerosa','treviolo305','treviolo315','seriate','azzano1','azzano2','dalmine','valverde45','ponteranica-monviso','pedrengo-caravaggio8','dalmine-25aprile80','bergamo-martinella19','treviolo-rossini']);
    const sourceOrder=new Map(homes.map((h,i)=>[h.id,i]));
    const map=L.map('map',{zoomControl:true}).setView([45.684,9.67],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const markers=new Map();
    const euro=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);
    function popup(h){return `<h3>${h.name}</h3><b>${euro(h.price)}</b><div style="margin:4px 0 8px;color:#666">${h.type} · ${h.sqm}</div><div>${h.note}</div><div style="margin-top:8px"><a href="${h.url}" target="_blank" rel="noopener" data-open-home="${h.id}">Apri annuncio</a></div>`}
    homes.forEach(h=>{const m=L.marker([h.lat,h.lng]).addTo(map).bindPopup(popup(h));markers.set(h.id,m)});

    const sections=document.getElementById('sections'),summary=document.getElementById('summary'),statusFilter=document.getElementById('statusFilter');
    let active='all',sharedNotes={},sharedStates={};
    const sectionMeta={new:{label:'Nuovi',icon:'🆕'},'da-vedere':{label:'Da vedere',icon:'👀'},'da-valutare':{label:'Da valutare',icon:'🤔'},ignorare:{label:'Ignorare',icon:'🚫'}};
    const stateKey=homeId=>`state-${homeId}`;
    function rebuildStates(){
      sharedStates={};
      homes.forEach(h=>{
        const rows=sharedNotes[stateKey(h.id)]||[];
        for(let i=rows.length-1;i>=0;i--){
          try{
            const value=JSON.parse(rows[i].text||'');
            if(value&&typeof value==='object'){sharedStates[h.id]=value;break}
          }catch{}
        }
      });
    }
    function houseState(h){return sharedStates[h.id]||{}}
    function preference(h){return houseState(h).preference||'da-valutare'}
    function isNew(h){return !baselineIds.has(h.id)&&!houseState(h).seenAt}
    function sectionKey(h){return isNew(h)?'new':preference(h)}
    function matches(h){let ok=true;if(active==='city')ok=h.city;if(active==='garage')ok=h.garage;if(active==='garden')ok=h.garden;if(active==='3bed')ok=h.beds>=3;const s=statusFilter.value;if(s==='new')ok=ok&&isNew(h);else if(s!=='all')ok=ok&&preference(h)===s;return ok}
    function formatDate(iso){try{return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}catch{return ''}}
    function fillNotes(homeId){const box=document.querySelector(`[data-notes-for="${homeId}"]`);if(!box)return;box.innerHTML='';const notes=sharedNotes[homeId]||[];if(!notes.length){const e=document.createElement('div');e.className='no-notes';e.textContent='Nessuna nota ancora.';box.appendChild(e);return}notes.slice().reverse().forEach(n=>{const item=document.createElement('div');item.className='note-item';const head=document.createElement('div');head.className='note-head';head.textContent=`${n.author} · ${formatDate(n.createdAt)}`;const text=document.createElement('div');text.className='note-text';text.textContent=n.text;item.append(head,text);box.appendChild(item)})}
    function decisionButton(h,value,label){return `<button type="button" data-pref="${h.id}" data-pref-value="${value}" class="${preference(h)===value?'active':''}">${label}</button>`}
    function cardHtml(h){const newBadge=isNew(h)?'<span class="new-badge">NEW</span>':'';return `<div style="display:flex;justify-content:space-between;gap:12px"><div><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><h2>${h.name}</h2>${newBadge}</div><div class="meta">${h.type} · ${h.sqm}</div></div><div class="price">${euro(h.price)}</div></div><div class="chips">${h.tags.map(t=>`<span class="chip">${t}</span>`).join('')}<span class="chip rating">${h.rating}</span></div><div class="note">${h.note}</div><div class="warning" style="font-size:12px;margin-top:8px">${h.warning||''}</div><div class="decision">${decisionButton(h,'da-vedere','👀 Da vedere')}${decisionButton(h,'da-valutare','🤔 Valutare')}${decisionButton(h,'ignorare','🚫 Ignora')}</div><div class="actions"><a class="secondary" href="#map" data-map="${h.id}">Mappa</a><a class="primary" href="${h.url}" target="_blank" rel="noopener" data-open-home="${h.id}">Annuncio</a><button class="secondary" type="button" data-add-note="${h.id}">＋ Nota</button></div><div class="user-notes"><div class="user-notes-title"><span>Note vostre</span><span>${(sharedNotes[h.id]||[]).length}</span></div><div class="note-list" data-notes-for="${h.id}"></div></div>`}
    function render(){sections.innerHTML='';const visible=homes.filter(matches);const newCount=visible.filter(isNew).length;summary.textContent=`${visible.length} ${visible.length===1?'casa':'case'} visibili${newCount?` · ${newCount} nuove`:''}`;
      homes.forEach(h=>{const m=markers.get(h.id);if(matches(h)){if(!map.hasLayer(m))m.addTo(map)}else if(map.hasLayer(m))map.removeLayer(m)});
      const groups={new:[],'da-vedere':[],'da-valutare':[],ignorare:[]};visible.forEach(h=>groups[sectionKey(h)].push(h));groups.new.sort((a,b)=>(sourceOrder.get(b.id)||0)-(sourceOrder.get(a.id)||0));
      ['new','da-vedere','da-valutare','ignorare'].forEach(key=>{const items=groups[key];if(!items.length)return;const block=document.createElement('section');block.className='section-block';const meta=sectionMeta[key];block.innerHTML=`<div class="section-head"><div class="section-title"><span>${meta.icon}</span><span>${meta.label}</span></div><span class="section-count">${items.length}</span></div><div class="section-grid" data-section-grid="${key}"></div>`;sections.appendChild(block);const grid=block.querySelector('[data-section-grid]');items.forEach(h=>{const el=document.createElement('article');el.className=`card${isNew(h)?' is-new':''}${preference(h)==='ignorare'?' is-ignored':''}`;el.innerHTML=cardHtml(h);grid.appendChild(el);fillNotes(h.id)})});
      sections.querySelectorAll('[data-map]').forEach(a=>a.addEventListener('click',()=>{const h=homes.find(x=>x.id===a.dataset.map);setTimeout(()=>{map.setView([h.lat,h.lng],15);markers.get(h.id).openPopup()},100)}));
      sections.querySelectorAll('[data-add-note]').forEach(b=>b.addEventListener('click',()=>openNoteDialog(b.dataset.addNote)));
      sections.querySelectorAll('[data-pref]').forEach(b=>b.addEventListener('click',()=>setPreference(b.dataset.pref,b.dataset.prefValue)));
    }
    async function loadNotes(){try{const r=await fetch('/api/notes',{cache:'no-store'});if(r.ok){sharedNotes=await r.json();rebuildStates();render()}}catch(e){console.warn('Note non disponibili',e)}}
    function stateAuthor(){const saved=localStorage.getItem('note-author');return saved==='Camilla'?'Camilla':'Bogdan'}
    async function saveState(homeId,state,keepalive=false){
      const key=stateKey(homeId),now=new Date().toISOString(),row={author:stateAuthor(),text:JSON.stringify(state),createdAt:now};
      if(!Array.isArray(sharedNotes[key]))sharedNotes[key]=[];sharedNotes[key].push(row);
      const r=await fetch('/api/notes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({homeId:key,author:row.author,text:row.text}),keepalive});
      if(!r.ok)throw new Error('Errore salvataggio stato');
    }
    async function setPreference(homeId,value){const before=sharedStates[homeId];const next={...(before||{}),preference:value,updatedAt:new Date().toISOString()};sharedStates[homeId]=next;render();try{await saveState(homeId,next)}catch(err){if(before)sharedStates[homeId]=before;else delete sharedStates[homeId];render();alert('Non sono riuscito a salvare la valutazione. Riprova tra poco.')}}
    function markSeen(homeId){const h=homes.find(x=>x.id===homeId);if(!h||baselineIds.has(homeId)||houseState(h).seenAt)return;const before=sharedStates[homeId],now=new Date().toISOString(),next={...(before||{}),seenAt:now,updatedAt:now};sharedStates[homeId]=next;render();saveState(homeId,next,true).catch(e=>{if(before)sharedStates[homeId]=before;else delete sharedStates[homeId];render();console.warn('Stato NEW non salvato',e)})}

    document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));
    statusFilter.addEventListener('change',render);document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-open-home]');if(a)markSeen(a.dataset.openHome)});render();loadNotes();

    const suggestDlg=document.getElementById('suggestDialog');document.getElementById('openSuggest').addEventListener('click',()=>suggestDlg.showModal());document.getElementById('closeSuggest').addEventListener('click',()=>suggestDlg.close());suggestDlg.addEventListener('click',e=>{if(e.target===suggestDlg)suggestDlg.close()});

    const noteDlg=document.getElementById('noteDialog'),noteForm=document.getElementById('noteForm'),noteText=document.getElementById('noteText'),noteAuthor=document.getElementById('noteAuthor'),saveNote=document.getElementById('saveNote');
    const savedAuthor=localStorage.getItem('note-author');if(savedAuthor==='Bogdan'||savedAuthor==='Camilla')noteAuthor.value=savedAuthor;
    function openNoteDialog(homeId){const h=homes.find(x=>x.id===homeId);if(!h)return;document.getElementById('noteHomeId').value=homeId;document.getElementById('noteHomeName').textContent=h.name;noteText.value='';noteDlg.showModal();setTimeout(()=>noteText.focus(),100)}
    document.getElementById('closeNote').addEventListener('click',()=>noteDlg.close());noteDlg.addEventListener('click',e=>{if(e.target===noteDlg)noteDlg.close()});
    noteForm.addEventListener('submit',async e=>{e.preventDefault();const homeId=document.getElementById('noteHomeId').value,text=noteText.value.trim(),author=noteAuthor.value;if(!text)return;localStorage.setItem('note-author',author);saveNote.disabled=true;saveNote.textContent='Salvo…';try{const r=await fetch('/api/notes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({homeId,author,text})});if(!r.ok)throw new Error('Errore salvataggio');noteDlg.close();await loadNotes()}catch(err){alert('Non sono riuscito a salvare la nota. Riprova tra poco.')}finally{saveNote.disabled=false;saveNote.textContent='Salva nota'}});
  </script>
</body>
</html>
