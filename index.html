<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Cerco Casa · Bogdan & Camilla</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root{--bg:#f7f5f1;--card:#fff;--text:#222;--muted:#6f6a63;--accent:#1f6f5f;--line:#ded8d0;--chip:#ece7df;--warn:#a5641c;--new:#7b3ff2;--good:#147a54;--eval:#a5641c;--ignore:#77716a}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{padding:16px 16px 10px;position:sticky;top:0;background:rgba(247,245,241,.96);backdrop-filter:blur(10px);z-index:1000;border-bottom:1px solid var(--line)}
    h1{font-size:22px;margin:0 0 3px}.sub{color:var(--muted);font-size:14px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.addbtn{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;padding:10px 12px;min-height:42px;white-space:nowrap;font-size:14px}
    .filters{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}.filters button,.filters select{min-height:42px;border:1px solid var(--line);border-radius:999px;background:white;padding:0 13px;font-size:15px;white-space:nowrap;color:var(--text)}.filters .active{background:var(--accent);color:#fff;border-color:var(--accent)}
    #map{height:48vh;min-height:340px;border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:0 auto}.summary{padding:12px 16px 0;color:var(--muted);font-size:14px}.sections{display:grid;gap:20px;padding:12px 16px 30px}.section-block{display:grid;gap:10px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 2px}.section-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}.section-count{font-size:12px;font-weight:800;min-width:26px;height:26px;border-radius:999px;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}.section-grid{display:grid;grid-template-columns:1fr;gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;position:relative}.card.is-new{border-color:#c9b7f8;box-shadow:0 4px 18px rgba(123,63,242,.08)}.card.is-ignored{opacity:.78}.card h2{font-size:18px;margin:0 0 4px}.price{font-weight:700;font-size:18px}.meta{color:var(--muted);font-size:14px;margin:4px 0 10px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font-size:12px;background:var(--chip);padding:5px 8px;border-radius:999px}.rating{font-weight:700;color:var(--accent)}.new-badge{font-size:11px;letter-spacing:.05em;font-weight:900;color:#fff;background:var(--new);padding:5px 8px;border-radius:999px;white-space:nowrap}.note{font-size:14px;line-height:1.4}.warning{color:var(--warn);font-weight:600}
    .reactions{margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#faf8f4}.reactions-title{font-size:11px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}.reaction-row{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center}.reaction-row+.reaction-row{margin-top:8px;padding-top:8px;border-top:1px solid #e9e4dc}.person{font-size:12px;font-weight:850;white-space:nowrap}.person.bogdan{color:#315f89}.person.camilla{color:#8b4f75}.decision{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.decision button{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:37px;padding:6px 4px;font:inherit;font-size:11px;font-weight:750;color:var(--text)}.decision button.active[data-pref-value="da-vedere"]{background:#e9f6f0;border-color:#9bcdb8;color:var(--good)}.decision button.active[data-pref-value="da-valutare"]{background:#fff4e8;border-color:#e7c08c;color:var(--eval)}.decision button.active[data-pref-value="ignorare"]{background:#efede9;border-color:#c9c3bc;color:#5f5b56}
    .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions a,.actions button{flex:1;min-width:92px;text-align:center;text-decoration:none;padding:11px;border-radius:12px;font:inherit;font-weight:600;min-height:44px}.primary{background:var(--accent);color:#fff;border:1px solid var(--accent)}.secondary{border:1px solid var(--line);color:var(--text);background:#fff}
    .user-notes{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.user-notes-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px}.note-list{display:grid;gap:7px}.note-item{background:#f5f2ed;border-radius:12px;padding:9px 10px}.note-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-bottom:4px}.note-text{font-size:13px;line-height:1.35;white-space:pre-wrap}.note-edit-btn{border:0;background:transparent;color:var(--accent);font:inherit;font-weight:800;padding:3px 5px;cursor:pointer;white-space:nowrap}.no-notes{font-size:12px;color:var(--muted)}
    .hidden{display:none!important}.leaflet-popup-content{margin:12px 14px;min-width:220px}.leaflet-popup-content h3{margin:0 0 4px}.leaflet-control-attribution{font-size:9px}
    dialog{border:0;border-radius:20px;padding:0;width:min(92vw,520px);box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.42)}.modal{padding:18px}.modal h2{margin:0 0 4px;font-size:21px}.modal p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.4}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;color:var(--text)}.field textarea{min-height:100px;resize:vertical}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions button{min-height:44px;border-radius:12px;padding:0 14px;font:inherit;font-weight:700}.send{background:var(--accent);color:#fff;border:0;flex:1}.cancel{background:#fff;border:1px solid var(--line)}.small{font-size:12px;color:var(--muted)}
    @media(max-width:440px){.reaction-row{grid-template-columns:1fr}.person{margin-bottom:-2px}.decision button{font-size:10px}.note-head{align-items:flex-start}.note-edit-btn{margin-top:-3px}}
    @media(min-width:760px){#map{height:56vh}.section-grid{grid-template-columns:repeat(2,1fr)}header{padding-left:24px;padding-right:24px}.summary{padding-left:24px}.sections{padding-left:24px;padding-right:24px}.addbtn{font-size:15px}}
  </style>
</head>
<body>
  <header><div class="wrap">
    <div class="topline"><div><h1>🏡 Cerco Casa</h1><div class="sub">Bogdan & Camilla · target ~€300k · fino a €360k se trattabile o pronta</div></div><button class="addbtn" id="openSuggest" type="button">＋ Segnala casa</button></div>
    <div class="filters">
      <button data-filter="all" class="active">Tutte</button><button data-filter="city">Bergamo città</button><button data-filter="garage">Garage</button><button data-filter="garden">Giardino</button><button data-filter="3bed">3+ camere</button>
      <select id="statusFilter" aria-label="Gradimento"><option value="all">Tutti i gradimenti</option><option value="new">🆕 Nuovi</option><option value="da-vedere">👀 Da vedere</option><option value="da-valutare">🤔 Da valutare</option><option value="ignorare">🗑️ Scartate</option></select>
      <select id="sortOrder" aria-label="Ordina annunci"><option value="added-desc">🆕 Aggiunta: più recenti</option><option value="added-asc">🕰️ Aggiunta: meno recenti</option><option value="price-asc">💶 Prezzo: crescente</option><option value="price-desc">💶 Prezzo: decrescente</option><option value="sqm-desc">📐 Metratura: maggiore</option><option value="sqm-asc">📐 Metratura: minore</option><option value="rating-desc">⭐ Valutazione: migliore</option><option value="beds-desc">🛏️ Camere: più numerose</option><option value="name-asc">🔤 Località: A–Z</option></select>
    </div>
  </div></header>

  <div id="map"></div>
  <div class="wrap"><div class="summary" id="summary"></div><div class="sections" id="sections"></div></div>

  <dialog id="suggestDialog">
    <form class="modal" name="segnala-casa" method="POST" data-netlify="true" action="/grazie.html">
      <input type="hidden" name="form-name" value="segnala-casa" />
      <h2>Segnala una casa</h2><p>Incolla il link dell'annuncio. La segnalazione verrà analizzata e aggiunta alla mappa.</p>
      <div class="field"><label for="listingUrl">Link annuncio *</label><input id="listingUrl" name="url" type="url" required placeholder="https://www.immobiliare.it/annunci/…" autocomplete="url" /></div>
      <div class="field"><label for="sender">Segnalata da *</label><select id="sender" name="segnalata-da" required><option value="Camilla">Camilla</option><option value="Bogdan">Bogdan</option></select></div>
      <div class="field"><label for="priority">Priorità</label><select id="priority" name="priorita"><option value="Normale">Normale</option><option value="Da guardare subito">Da guardare subito</option></select></div>
      <div class="field"><label for="suggestNote">Nota</label><textarea id="suggestNote" name="nota" placeholder="Es. mi piace il giardino, controlla la zona…"></textarea></div>
      <div class="modal-actions"><button class="cancel" id="closeSuggest" type="button">Annulla</button><button class="send" type="submit">Invia segnalazione</button></div>
    </form>
  </dialog>

  <dialog id="noteDialog">
    <form class="modal" id="noteForm">
      <input type="hidden" id="noteHomeId" />
      <h2 id="noteDialogTitle">📝 Aggiungi nota</h2><p id="noteHomeName"></p>
      <div class="field"><label for="noteAuthor">Scritta da</label><select id="noteAuthor" required><option value="Bogdan">Bogdan</option><option value="Camilla">Camilla</option></select></div>
      <div class="field"><label for="noteText">Nota *</label><textarea id="noteText" required maxlength="1000" placeholder="Es. zona molto bella, cucina da rifare, chiamare l'agenzia…"></textarea></div>
      <div class="small" id="noteHint">Le note sono condivise: le vedrete entrambi anche da dispositivi diversi.</div>
      <div class="modal-actions"><button class="cancel" id="closeNote" type="button">Annulla</button><button class="send" id="saveNote" type="submit">Salva nota</button></div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/homes.js?v=20260916-2149"></script>
  <script src="/sort-priority.js?v=20260916-2149"></script>
  <script src="/app.js?v=20260916-2149"></script>
  <script src="/note-delete.js?v=20260916-2149"></script>

</body>
</html>
