name: Process house suggestions

on:
  push:
    paths:
      - 'incoming-suggestions/**'
      - 'scripts/process-suggestions.mjs'
      - 'scripts/run-process-with-browser.mjs'
      - '.github/workflows/process-suggestions.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-house-suggestions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # Keep maintenance failures non-blocking so GitHub does not email workflow-failure notices.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser fallback
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Process pending suggestions
        run: node scripts/run-process-with-browser.mjs

      - name: Validate catalog
        run: node scripts/validate-homes.mjs

      - name: Commit generated changes
        run: |
          if git diff --quiet -- homes.json processed-suggestions.json processing-errors.json; then
            echo 'No catalog changes to commit.'
            exit 0
          fi
          git config user.name 'cerco-casa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add homes.json processed-suggestions.json processing-errors.json
          git commit -m 'Process queued house suggestions'
          git push
