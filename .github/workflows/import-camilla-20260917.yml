name: Import Camilla suggestions

on:
  push:
    paths:
      - 'scripts/import-camilla-20260917.mjs'
      - '.github/workflows/import-camilla-20260917.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Import enriched suggestions
        run: node scripts/import-camilla-20260917.mjs

      - name: Validate catalog
        run: node scripts/validate-homes.mjs

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- homes.json processed-suggestions.json; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'cerco-casa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add homes.json processed-suggestions.json
          git commit -m 'Import Camilla house suggestions'
          git push
