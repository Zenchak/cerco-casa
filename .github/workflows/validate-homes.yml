name: Validate homes.json

on:
  push:
    paths:
      - 'homes.json'
      - 'scripts/validate-homes.mjs'
      - 'package.json'
  pull_request:
    paths:
      - 'homes.json'
      - 'scripts/validate-homes.mjs'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    # Validation stays visible in Actions, but does not generate failure-email noise.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate homes data
        run: npm run validate:homes
