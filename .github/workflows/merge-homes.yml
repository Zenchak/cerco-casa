name: Merge modular homes

on:
  push:
    branches: [main]
    paths:
      - "homes/**"
      - "scripts/merge-homes.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge homes
        run: node scripts/merge-homes.mjs
      - name: Validate homes
        run: npm run validate:homes
      - name: Commit generated homes.json
        run: |
          if git diff --quiet -- homes.json; then
            echo "homes.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homes.json
          git commit -m "chore: regenerate homes.json"
          git push
